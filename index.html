<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPS DARK - لوحة التحكم</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #0a0a1a 0%, #0a0a2a 100%);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* خلفية متحركة */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    
    .particle {
      position: absolute;
      background: radial-gradient(circle, #00d4ff, transparent);
      border-radius: 50%;
      animation: float 20s infinite linear;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
      50% { transform: translateY(-100px) rotate(180deg); opacity: 0.8; }
    }
    
    .topbar {
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #00d4ff;
      position: relative;
      z-index: 10;
    }
    
    .logo {
      font-size: 24px;
      font-weight: bold;
      background: linear-gradient(90deg, #00d4ff, #0066ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    
    .new-server-btn {
      background: linear-gradient(90deg, #00d4ff, #0066ff);
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    
    .new-server-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
    }
    
    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
      position: relative;
      z-index: 10;
    }
    
    .servers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    
    .server-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 20px;
      border: 1px solid rgba(0, 212, 255, 0.3);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .server-card:hover {
      transform: translateY(-5px);
      border-color: #00d4ff;
      box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
    }
    
    .server-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #00d4ff;
    }
    
    .server-status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 10px;
      font-weight: 600;
    }
    
    .status-running {
      background: rgba(0, 255, 0, 0.2);
      color: #00ff00;
      border: 1px solid rgba(0, 255, 0, 0.3);
    }
    
    .status-stopped {
      background: rgba(255, 0, 0, 0.2);
      color: #ff5555;
      border: 1px solid rgba(255, 0, 0, 0.3);
    }
    
    /* صفحة السيرفر */
    .server-view {
      display: none;
    }
    
    .back-btn {
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 15px;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background 0.3s;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    .server-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }
    
    .tabs {
      display: flex;
      gap: 10px;
    }
    
    .tab {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
    }
    
    .tab.active {
      background: linear-gradient(90deg, #00d4ff, #0066ff);
    }
    
    .console-layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
    }

    @media (max-width: 900px) {
      .console-layout {
        grid-template-columns: 1fr;
      }
    }

    .console {
      background: rgba(0, 0, 0, 0.85);
      border-radius: 10px;
      padding: 20px;
      height: 500px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
      border: 1px solid rgba(0, 212, 255, 0.2);
    }
    
    .control-panel {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .control-btn {
      width: 100%;
      padding: 12px;
      margin: 5px 0;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.3s, transform 0.2s;
    }

    .control-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    
    .btn-start {
      background: linear-gradient(90deg, #00ff00, #00aa00);
      color: white;
    }
    
    .btn-stop {
      background: linear-gradient(90deg, #ff0000, #aa0000);
      color: white;
    }
    
    .btn-restart {
      background: linear-gradient(90deg, #ffa500, #ff6600);
      color: white;
    }
    
    .stats-card {
      background: rgba(0, 0, 0, 0.5);
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.8;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .files-table-container {
      overflow-x: auto;
    }

    .files-table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }
    
    .files-table th, .files-table td {
      padding: 12px;
      text-align: right;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .files-table th {
      background: rgba(0, 212, 255, 0.1);
      color: #00d4ff;
    }
    
    .file-btn {
      padding: 6px 12px;
      margin: 0 3px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    .file-btn:hover {
      opacity: 0.85;
    }
    
    .upload-area {
      border: 2px dashed #00d4ff;
      border-radius: 10px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: background 0.3s;
      background: rgba(0, 212, 255, 0.02);
    }
    
    .upload-area:hover {
      background: rgba(0, 212, 255, 0.08);
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .modal-content {
      background: #1a1a2a;
      border-radius: 15px;
      padding: 30px;
      width: 100%;
      max-width: 600px;
      border: 1px solid rgba(0, 212, 255, 0.4);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    .modal-content h3 {
      margin-bottom: 15px;
      color: #00d4ff;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-confirm {
      background: linear-gradient(90deg, #00d4ff, #0066ff);
      color: white;
    }

    .btn-cancel {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .modal-buttons button:hover {
      opacity: 0.9;
    }
    
    textarea {
      width: 100%;
      height: 350px;
      background: #0a0a1a;
      border: 1px solid #00d4ff;
      color: white;
      padding: 12px;
      font-family: monospace;
      margin: 10px 0;
      border-radius: 8px;
      resize: vertical;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #0a0a1a;
      border: 1px solid #00d4ff;
      color: white;
      border-radius: 8px;
      outline: none;
    }

    input[type="text"]:focus {
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  
  <div class="topbar">
    <div class="logo">🚀 VPS DARK</div>
    <div>
      <span style="margin-left: 15px;">مرحباً، <span id="username" style="color: #00d4ff; font-weight: bold;">زائر</span></span>
      <button onclick="logout()" style="background: rgba(255,0,0,0.3); color: white; padding: 6px 15px; border: 1px solid rgba(255,0,0,0.5); border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.3s;">🚪 خروج</button>
    </div>
  </div>
  
  <!-- الصفحة الرئيسية -->
  <div id="mainView" class="container">
    <button class="new-server-btn" onclick="showNewServerModal()">➕ سيرفر جديد</button>
    <div class="servers-grid" id="serversGrid">
      <div style="text-align: center; padding: 50px; grid-column: 1 / -1; color: #888;">جاري التحميل...</div>
    </div>
  </div>
  
  <!-- صفحة السيرفر -->
  <div id="serverView" class="container server-view">
    <button class="back-btn" onclick="backToMain()">← رجوع للقائمة</button>
    <div class="server-header">
      <h1 id="serverTitle" style="color: #fff;"></h1>
      <div class="tabs">
        <button class="tab active" onclick="switchTab('console')">📋 السجلات (Console)</button>
        <button class="tab" onclick="switchTab('files')">📁 الملفات</button>
      </div>
    </div>
    
    <div id="consoleTab">
      <div class="console-layout">
        <div class="console" id="consoleLog">
          <div style="color: #888;">جاري تحميل السجلات...</div>
        </div>
        <div class="control-panel">
          <button class="control-btn btn-start" onclick="serverAction('start')">▶️️ تشغيل</button>
          <button class="control-btn btn-restart" onclick="serverAction('restart')">🔄 إعادة تشغيل</button>
          <button class="control-btn btn-stop" onclick="serverAction('stop')">⏹️ إيقاف</button>
          
          <div class="stats-card">
            <div>📊 الحالة: <span id="status" style="color: #ff5555; font-weight: bold;">🔴 واقف</span></div>
            <div>💾 الذاكرة: <span id="memory">0 MB</span></div>
            <div>⚡ المعالج: <span id="cpu">0%</span></div>
            <div>🌐 IP: <span id="ip">127.0.0.1</span></div>
          </div>
          
          <div class="stats-card">
            <div>📄 ملف التشغيل: <span id="startupFile" style="color: #00d4ff; cursor: pointer; text-decoration: underline;" onclick="changeStartup()" title="اضغط للتغيير">غير محدد</span></div>
          </div>
        </div>
      </div>
    </div>
    
    <div id="filesTab" style="display: none;">
      <div class="upload-area" onclick="document.getElementById('fileInput').click()" ondragover="event.preventDefault()" ondrop="handleDrop(event)">
        📤 اسحب الملفات هنا أو اضغط للرفع
        <input type="file" id="fileInput" multiple style="display: none;" onchange="uploadFiles(this.files)">
      </div>
      
      <div class="files-table-container">
        <table class="files-table">
          <thead>
            <tr><th>الملف</th><th>الحجم</th><th>الإجراءات</th></tr>
          </thead>
          <tbody id="filesList">
            <tr><td colspan="3" style="text-align: center; color: #888;">جاري تحميل الملفات...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  
  <!-- نافذة الإدخال -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle"></h3>
      <input type="text" id="modalInput" placeholder="" autocomplete="off">
      <div class="modal-buttons">
        <button class="btn-confirm" onclick="modalConfirm()">تأكيد</button>
        <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
      </div>
    </div>
  </div>
  
  <!-- محرر الملفات -->
  <div id="editorModal" class="modal">
    <div class="modal-content" style="max-width: 800px;">
      <h3 id="editorTitle"></h3>
      <textarea id="editorContent"></textarea>
      <div class="modal-buttons">
        <button class="btn-confirm" onclick="saveFile()">💾 حفظ</button>
        <button class="btn-cancel" onclick="closeEditor()">❌ إلغاء</button>
      </div>
    </div>
  </div>
  
  <script>
    let currentServer = null;
    let currentFile = null;
    let pollingInterval = null;
    
    // إنشاء الجسيمات الخلفية
    function createParticles() {
      const container = document.getElementById('particles');
      if (!container) return;
      container.innerHTML = '';
      for (let i = 0; i < 40; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        const size = Math.random() * 4 + 2 + 'px';
        particle.style.width = size;
        particle.style.height = size;
        particle.style.animationDelay = Math.random() * 20 + 's';
        particle.style.animationDuration = 15 + Math.random() * 10 + 's';
        container.appendChild(particle);
      }
    }
    
    // التحقق من صلاحيات المستخدم
    async function checkAuth() {
      try {
        const res = await fetch('/api/current_user');
        if (!res.ok) throw new Error('Not authenticated');
        const data = await res.json();
        
        if (!data.success) {
          window.location.href = '/login';
          return;
        }
        
        document.getElementById('username').textContent = data.username || 'مستخدم';
        createParticles();
        loadServers();
      } catch (error) {
        window.location.href = '/login';
      }
    }
    
    // تحميل السيرفرات
    async function loadServers() {
      try {
        const res = await fetch('/servers');
        const data = await res.json();
        const grid = document.getElementById('serversGrid');
        
        if (!data.servers || data.servers.length === 0) {
          grid.innerHTML = '<div style="text-align: center; padding: 50px; grid-column: 1 / -1; color: #888;">📭 لا توجد سيرفرات حالياً، اضغط على زر "سيرفر جديد" للإضافة.</div>';
          return;
        }
        
        grid.innerHTML = data.servers.map(s => `
          <div class="server-card" onclick="openServer('${s.folder}', '${s.title}')">
            <div class="server-title">${s.title}</div>
            <div style="color: #aaa; font-size: 14px; margin-bottom: 8px;">${s.subtitle || ''}</div>
            <div class="server-status ${s.status === 'running' ? 'status-running' : 'status-stopped'}">
              ${s.status === 'running' ? '🟢 شغال' : '🔴 واقف'}
            </div>
            <div style="font-size: 12px; margin-top: 10px; color: #888;">
              ${s.startup_file ? '⚙️ ' + s.startup_file : '📁 لا يوجد ملف تشغيل'}
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading servers:', error);
        document.getElementById('serversGrid').innerHTML = '<div style="text-align: center; padding: 50px; grid-column: 1 / -1; color: #ff5555;">⚠️ حدث خطأ أثناء تحميل السيرفرات.</div>';
      }
    }
    
    // فتح السيرفر المحدد
    function openServer(folder, title) {
      currentServer = folder;
      document.getElementById('mainView').style.display = 'none';
      document.getElementById('serverView').style.display = 'block';
      document.getElementById('serverTitle').textContent = title;
      
      loadStartupFile();
      
      if (pollingInterval) clearInterval(pollingInterval);
      pollingInterval = setInterval(updateStats, 2000);
      updateStats();
    }
    
    // تحديد أيقونة الملف تلقائياً بناءً على الامتداد
    function getFileIcon(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      if (ext === 'py') return '🐍';
      if (ext === 'js' || ext === 'ts') return '💛';
      if (ext === 'json') return '⚙️';
      if (ext === 'txt' || ext === 'md') return '📝';
      if (ext === 'env') return '🔒';
      if (ext === 'zip' || ext === 'rar' || ext === 'tar' || ext === 'gz') return '📦';
      if (ext === 'sh' || ext === 'bat') return '⚡';
      return '📄';
    }

    // تحميل ملف التشغيل والبيانات الوصفية
    async function loadStartupFile() {
      try {
        const filesRes = await fetch(`/files/list/${currentServer}`);
        if (!filesRes.ok) return;
        const files = await filesRes.json();
        
        const metaFile = files.find(f => f.name === 'meta.json');
        if (metaFile) {
          const metaRes = await fetch(`/files/content/${currentServer}/meta.json`);
          if (metaRes.ok) {
            const meta = await metaRes.json();
            if (meta.content) {
              const metaData = JSON.parse(meta.content);
              if (metaData.startup_file) {
                document.getElementById('startupFile').textContent = metaData.startup_file;
              }
            }
          }
        }
      } catch(e) {
        console.error('Error loading startup file:', e);
      }
    }
    
    // تحديث إحصائيات السيرفر والسجلات
    async function updateStats() {
      if (!currentServer) return;
      
      try {
        const res = await fetch(`/server/stats/${currentServer}`);
        if (!res.ok) return;
        const data = await res.json();
        
        const statusEl = document.getElementById('status');
        const isRunning = data.status === '🟢 شغال' || data.status === 'running';
        statusEl.innerHTML = isRunning ? '🟢 شغال' : '🔴 واقف';
        statusEl.style.color = isRunning ? '#00ff00' : '#ff5555';
        
        document.getElementById('memory').textContent = data.mem || '0 MB';
        document.getElementById('cpu').textContent = data.cpu || '0%';
        document.getElementById('ip').textContent = data.ip || '127.0.0.1';
        
        const consoleLog = document.getElementById('consoleLog');
        const isScrolledToBottom = consoleLog.scrollHeight - consoleLog.scrollTop <= consoleLog.clientHeight + 50;
        
        consoleLog.innerHTML = data.logs || '[لا توجد سجلات حالياً]';
        
        if (isScrolledToBottom) {
          consoleLog.scrollTop = consoleLog.scrollHeight;
        }
      } catch (error) {
        console.error('Error updating stats:', error);
      }
    }
    
    // تنفيذ إجراء على السيرفر (تشغيل، إيقاف، إعادة تشغيل)
    async function serverAction(action) {
      try {
        const res = await fetch(`/server/action/${currentServer}/${action}`, {
          method: 'POST'
        });
        const data = await res.json();
        
        if (data.success) {
          setTimeout(updateStats, 1000);
        } else {
          alert(data.message || 'حدث خطأ أثناء تنفيذ الإجراء');
        }
      } catch (error) {
        alert('خطأ في الاتصال بالخادم');
      }
    }
    
    // تغيير ملف التشغيل
    function changeStartup() {
      showModal('تعيين ملف التشغيل', 'أدخل اسم الملف (مثال: main.py أو index.js)', async (value) => {
        if (!value) return;
        
        try {
          const filesRes = await fetch(`/files/list/${currentServer}`);
          const files = await filesRes.json();
          
          let metaContent = { startup_file: value };
          const metaFile = files.find(f => f.name === 'meta.json');
          if (metaFile) {
            const metaRes = await fetch(`/files/content/${currentServer}/meta.json`);
            if (metaRes.ok) {
              const meta = await metaRes.json();
              if (meta.content) {
                try {
                  metaContent = { ...JSON.parse(meta.content), startup_file: value };
                } catch(e) {}
              }
            }
          }
          
          await fetch(`/files/save/${currentServer}/meta.json`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: JSON.stringify(metaContent, null, 2) })
          });
          
          await fetch(`/server/set-startup/${currentServer}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ file: value })
          });
          
          document.getElementById('startupFile').textContent = value;
          alert('✅ تم تعيين ملف التشغيل بنجاح');
        } catch (error) {
          alert('❌ خطأ في حفظ ملف التشغيل');
        }
      });
    }
    
    // تحميل قائمة الملفات
    async function loadFiles() {
      try {
        const res = await fetch(`/files/list/${currentServer}`);
        const files = await res.json();
        const tbody = document.getElementById('filesList');
        
        if (!files || files.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #888;">📂 لا توجد ملفات في هذا السيرفر</td></tr>';
          return;
        }
        
        tbody.innerHTML = files.map(f => {
          const icon = getFileIcon(f.name);
          return `
            <tr>
              <td>${icon} ${f.name}</td>
              <td>${f.size || 'غير معروف'}</td>
              <td>
                <button class="file-btn" onclick="editFile('${f.name}')" style="background: #00d4ff; color: #000;">✏️ تعديل</button>
                <button class="file-btn" onclick="deleteFile('${f.name}')" style="background: #ff5555; color: #fff;">🗑️ حذف</button>
                ${f.name === 'requirements.txt' ? '<button class="file-btn" onclick="installRequirements()" style="background: #ffa500; color: #000;">📦 تثبيت</button>' : ''}
              </td>
            </tr>
          `;
        }).join('');
      } catch (error) {
        console.error('Error loading files:', error);
        document.getElementById('filesList').innerHTML = '<tr><td colspan="3" style="text-align: center; color: #ff5555;">⚠️ خطأ في تحميل الملفات</td></tr>';
      }
    }
    
    // رفع الملفات
    async function uploadFiles(files) {
      if (!files || files.length === 0) return;
      const formData = new FormData();
      for (let file of files) {
        formData.append('files[]', file);
      }
      
      try {
        const res = await fetch(`/files/upload/${currentServer}`, {
          method: 'POST',
          body: formData
        });
        
        const data = await res.json();
        if (data.success) {
          alert(`✅ تم رفع الملفات بنجاح`);
          loadFiles();
        } else {
          alert(data.message || '❌ فشل رفع الملفات');
        }
      } catch (error) {
        alert('❌ خطأ في الاتصال أثناء الرفع');
      }
    }
    
    // دعم السحب والإفلات للملفات
    function handleDrop(e) {
      e.preventDefault();
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        uploadFiles(files);
      }
    }
    
    // فتح محرر الملفات
    async function editFile(filename) {
      currentFile = filename;
      document.getElementById('editorTitle').textContent = `تعديل الملف: ${filename}`;
      
      try {
        const res = await fetch(`/files/content/${currentServer}/${filename}`);
        const data = await res.json();
        document.getElementById('editorContent').value = data.content || '';
        document.getElementById('editorModal').style.display = 'flex';
      } catch (error) {
        alert('❌ خطأ في قراءة محتوى الملف');
      }
    }
    
    // حفظ الملف المعدل
    async function saveFile() {
      const content = document.getElementById('editorContent').value;
      
      try {
        const res = await fetch(`/files/save/${currentServer}/${currentFile}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
        
        if (res.ok) {
          alert('✅ تم حفظ الملف بنجاح');
          closeEditor();
        } else {
          alert('❌ فشل حفظ الملف');
        }
      } catch (error) {
        alert('❌ خطأ في الاتصال');
      }
    }
    
    // حذف ملف
    async function deleteFile(filename) {
      if (!confirm(`⚠️ هل أنت متأكد من حذف الملف "${filename}"؟`)) return;
      
      try {
        const res = await fetch(`/files/delete/${currentServer}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: filename })
        });
        
        if (res.ok) {
          alert('✅ تم حذف الملف بنجاح');
          loadFiles();
        } else {
          alert('❌ فشل حذف الملف');
        }
      } catch (error) {
        alert('❌ خطأ في الاتصال');
      }
    }
    
    // تثبيت الحزم المتطلبة من requirements.txt
    async function installRequirements() {
      if (!confirm('📦 هل تريد تثبيت المتطلبات من ملف requirements.txt؟')) return;
      
      try {
        const res = await fetch(`/files/install/${currentServer}`, {
          method: 'POST'
        });
        const data = await res.json();
        
        if (data.success) {
          alert('✅ بدأ التثبيت بنجاح، يمكنك متابعة السجلات في قسم Console');
          switchTab('console');
        } else {
          alert('❌ ' + (data.message || 'فشل التثبيت'));
        }
      } catch (error) {
        alert('❌ خطأ في الاتصال');
      }
    }
    
    // التبديل بين التبويبات (السجلات / الملفات)
    function switchTab(tab) {
      const consoleTab = document.getElementById('consoleTab');
      const filesTab = document.getElementById('filesTab');
      const tabs = document.querySelectorAll('.tab');
      
      tabs.forEach(t => t.classList.remove('active'));
      
      if (tab === 'console') {
        consoleTab.style.display = 'block';
        filesTab.style.display = 'none';
        tabs[0].classList.add('active');
      } else {
        consoleTab.style.display = 'none';
        filesTab.style.display = 'block';
        tabs[1].classList.add('active');
        loadFiles();
      }
    }
    
    // نافذة إضافة سيرفر جديد
    function showNewServerModal() {
      showModal('سيرفر جديد', 'أدخل اسم السيرفر الجديد', async (name) => {
        if (!name) return;
        
        try {
          const res = await fetch('/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
          });
          
          if (res.ok) {
            alert('✅ تم إنشاء السيرفر بنجاح');
            loadServers();
          } else {
            alert('❌ فشل إنشاء السيرفر');
          }
        } catch (error) {
          alert('❌ خطأ في الاتصال');
        }
      });
    }
    
    // إدارة النوافذ المنبثقة مع دعم مفتاح الإدخال Enter
    function showModal(title, placeholder, callback) {
      document.getElementById('modalTitle').textContent = title;
      const input = document.getElementById('modalInput');
      input.placeholder = placeholder;
      input.value = '';
      document.getElementById('modal').style.display = 'flex';
      input.focus();
      
      window.modalCallback = callback;
    }
    
    document.getElementById('modalInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        modalConfirm();
      }
    });
    
    function modalConfirm() {
      const value = document.getElementById('modalInput').value;
      if (window.modalCallback) {
        window.modalCallback(value);
      }
      closeModal();
    }
    
    function closeModal() {
      document.getElementById('modal').style.display = 'none';
      window.modalCallback = null;
    }
    
    function closeEditor() {
      document.getElementById('editorModal').style.display = 'none';
    }
    
    function backToMain() {
      if (pollingInterval) {
        clearInterval(pollingInterval);
        pollingInterval = null;
      }
      currentServer = null;
      document.getElementById('mainView').style.display = 'block';
      document.getElementById('serverView').style.display = 'none';
      loadServers();
    }
    
    function logout() {
      if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
        fetch('/api/logout', { method: 'POST' }).then(() => {
          window.location.href = '/login';
        }).catch(() => {
          window.location.href = '/login';
        });
      }
    }
    
    // بدء التشغيل عند تحميل الصفحة
    document.addEventListener('DOMContentLoaded', checkAuth);
  </script>
</body>
</html>
